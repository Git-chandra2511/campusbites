<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusBites — Discover Food Around LPU</title>
  <link rel="icon" type="image/jpeg" href="images/campusbites-logo-3d.jpg" />

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- libraries -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- tailwind theme -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#FF6B35',
              hover: '#E85A24',
              soft: '#FFF1EB',
              border: '#FFD8C7'
            },
            canvas: '#FFF9F5',
            ink: '#17202A',
            slate: '#64748B',
            fresh: '#22A06B',
            gold: '#F5B942'
          },
          fontFamily: {
            heading: ['"Sora"', 'system-ui', 'sans-serif'],
            sans: ['"DM Sans"', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            card: '0 8px 30px rgba(23, 32, 42, 0.055)',
            cardHover: '0 16px 40px rgba(23, 32, 42, 0.11)',
            float: '0 14px 36px rgba(23, 32, 42, 0.12)'
          }
        }
      }
    };
  </script>

  <!-- custom styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="antialiased selection:bg-brand/20 selection:text-ink">

  <!-- navbar -->
  <header id="public-navbar" class="fixed top-0 inset-x-0 z-40 transition-all duration-300 nav-glass">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 lg:h-[72px] flex items-center justify-between gap-3">
      <!-- logo -->
      <button type="button" onclick="navigate('home')" class="flex items-center gap-2.5 group focus:outline-none shrink-0">
        <img src="images/campusbites-logo-3d.jpg" alt="CampusBites Logo" class="w-10 h-10 rounded-xl object-cover shadow-sm border border-brand-border/60 group-hover:scale-105 transition-transform" />
        <div class="text-left leading-tight">
          <div class="flex items-center gap-1.5">
            <span class="font-heading font-extrabold text-lg tracking-tight text-ink">Campus<span class="text-brand">Bites</span></span>
            <span id="nav-campus-badge" class="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded-md bg-brand-soft text-brand">LPU</span>
          </div>
        </div>
      </button>

      <!-- nav links -->
      <nav class="hidden lg:flex items-center gap-1" aria-label="Main navigation">
        <button type="button" data-nav="home" onclick="navigate('home')" class="nav-link px-3.5 py-2 rounded-xl text-sm font-medium transition-colors">Home</button>
        <button type="button" data-nav="explore" onclick="navigate('explore')" class="nav-link px-3.5 py-2 rounded-xl text-sm font-medium transition-colors">Explore Stalls</button>
        <button type="button" data-nav="categories" onclick="goToCategories()" class="nav-link px-3.5 py-2 rounded-xl text-sm font-medium transition-colors">Categories</button>
        <button type="button" data-nav="reviews" onclick="navigate('reviews')" class="nav-link px-3.5 py-2 rounded-xl text-sm font-medium transition-colors">Reviews</button>
        <button type="button" data-nav="about" onclick="openAboutModal()" class="nav-link px-3.5 py-2 rounded-xl text-sm font-medium transition-colors">About</button>
      </nav>

      <!-- right controls -->
      <div class="flex items-center gap-2 sm:gap-2.5">
        <form onsubmit="handleNavSearch(event)" class="hidden md:flex items-center relative">
          <i data-lucide="search" class="w-4 h-4 text-slate absolute left-3 pointer-events-none"></i>
          <input id="nav-search-input" type="text" placeholder="Search stalls or dishes..." class="w-44 xl:w-56 pl-9 pr-3 py-2 text-sm bg-white/90 border border-stone-200 rounded-xl focus:outline-none focus:border-brand focus:ring-2 focus:ring-brand/15 transition-all" />
        </form>

        <button type="button" onclick="navigate('favorites')" title="Saved Favorites" class="relative p-2.5 rounded-xl bg-white border border-stone-200 text-ink hover:border-brand/50 hover:text-brand transition-colors">
          <i data-lucide="heart" class="w-4 h-4"></i>
          <span id="nav-fav-badge" class="hidden absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-brand text-white text-[10px] font-bold flex items-center justify-center">0</span>
        </button>

        <button type="button" onclick="navigate('admin-overview')" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-ink text-white text-xs font-semibold hover:bg-ink/90 transition-colors">
          <i data-lucide="layout-dashboard" class="w-3.5 h-3.5 text-brand"></i>
          <span>Admin</span>
        </button>

        <div class="relative">
          <button type="button" id="avatar-btn" onclick="toggleAvatarMenu()" class="w-9 h-9 rounded-xl bg-brand-soft border border-brand-border text-brand font-heading font-bold text-sm flex items-center justify-center hover:bg-brand hover:text-white transition-colors" aria-label="Student menu">
            AS
          </button>
          <div id="avatar-menu" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-float border border-stone-100 p-2 z-50 animate-in">
            <div class="px-3 py-2 border-b border-stone-100 mb-1">
              <p class="text-sm font-semibold text-ink">Aarav Sharma</p>
              <p class="text-xs text-slate">B.Tech CSE • LPU Student</p>
            </div>
            <button type="button" onclick="toggleAvatarMenu(); navigate('favorites')" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-ink hover:bg-canvas rounded-xl transition-colors">
              <i data-lucide="heart" class="w-4 h-4 text-brand"></i> Saved Favorites
            </button>
            <button type="button" onclick="toggleAvatarMenu(); openReviewModal()" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-ink hover:bg-canvas rounded-xl transition-colors">
              <i data-lucide="pen-line" class="w-4 h-4 text-brand"></i> Write a Review
            </button>
            <button type="button" onclick="toggleAvatarMenu(); navigate('admin-overview')" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm text-ink hover:bg-canvas rounded-xl transition-colors">
              <i data-lucide="shield-check" class="w-4 h-4 text-fresh"></i> Admin Dashboard
            </button>
          </div>
        </div>

        <button type="button" onclick="toggleMobileMenu()" class="lg:hidden p-2 rounded-xl bg-white border border-stone-200 text-ink hover:border-brand transition-colors" aria-label="Toggle menu">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- mobile nav -->
    <div id="mobile-menu" class="hidden lg:hidden bg-white border-t border-stone-100 px-4 pt-3 pb-4 shadow-lg">
      <form onsubmit="handleMobileSearch(event)" class="relative mb-3">
        <i data-lucide="search" class="w-4 h-4 text-slate absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input id="mobile-search-input" type="text" placeholder="Search stalls, dosa, chai..." class="w-full pl-10 pr-4 py-2.5 text-sm bg-canvas border border-stone-200 rounded-xl focus:outline-none focus:border-brand" />
      </form>
      <div class="grid grid-cols-2 gap-1.5">
        <button type="button" onclick="toggleMobileMenu(); navigate('home')" class="flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-medium text-ink hover:bg-canvas">
          <i data-lucide="home" class="w-4 h-4 text-brand"></i> Home
        </button>
        <button type="button" onclick="toggleMobileMenu(); navigate('explore')" class="flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-medium text-ink hover:bg-canvas">
          <i data-lucide="compass" class="w-4 h-4 text-brand"></i> Explore Stalls
        </button>
        <button type="button" onclick="toggleMobileMenu(); goToCategories()" class="flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-medium text-ink hover:bg-canvas">
          <i data-lucide="grid-2x2" class="w-4 h-4 text-brand"></i> Categories
        </button>
        <button type="button" onclick="toggleMobileMenu(); navigate('reviews')" class="flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-medium text-ink hover:bg-canvas">
          <i data-lucide="star" class="w-4 h-4 text-gold"></i> Reviews
        </button>
        <button type="button" onclick="toggleMobileMenu(); navigate('favorites')" class="flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-medium text-ink hover:bg-canvas">
          <i data-lucide="heart" class="w-4 h-4 text-brand"></i> Favorites
        </button>
        <button type="button" onclick="toggleMobileMenu(); navigate('admin-overview')" class="flex items-center gap-2 px-3 py-2.5 rounded-xl text-sm font-medium text-white bg-ink">
          <i data-lucide="layout-dashboard" class="w-4 h-4 text-brand"></i> Admin Panel
        </button>
      </div>
    </div>
  </header>

  <!-- app containers -->
  <div id="app-root"></div>
  <div id="modal-root" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink/50 backdrop-blur-sm"></div>
  <div id="toast-root" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-[calc(100%-2.5rem)] pointer-events-none"></div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/components.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
